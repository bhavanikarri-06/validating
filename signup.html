<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>

<body>

    <h2>Sign Up</h2>

    <form>

        <label for="firstname">First Name:</label>
        <input type="text"
               id="firstname"
               name="firstname"
               pattern="[A-Za-z]{2,20}"
               required
               title="First name should contain only letters">

        <br><br>

        <label for="lastname">Last Name:</label>
        <input type="text"
               id="lastname"
               name="lastname"
               pattern="[A-Za-z]{2,20}"
               required
               title="Last name should contain only letters">

        <br><br>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="email"
               required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password"
               id="password"
               name="password"
               pattern="(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[@!#$%^&*]).{8,16}"
               required
               title="Password must contain uppercase, lowercase, number, special character and 8-16 characters">

        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel"
               id="phone"
               name="phone"
               pattern="[0-9]{10}"
               required
               title="Phone number must contain exactly 10 digits">

        <br><br>

        <input type="submit" value="Sign Up">

    </form>

    <br>

    <a href="login.html">Back to Login</a>

</body>
</html>
